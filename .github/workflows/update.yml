name: update

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Read release feed and rewrite version.json
        run: nix shell nixpkgs#curl nixpkgs#jq -c ./update.sh
      - name: Did anything change?
        id: diff
        run: |
          if git diff --quiet -- version.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build + check (only if a new version was found)
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix build .#grok-bot --print-build-logs
          nix build .#grok-bot-latest --print-build-logs
          nix flake check
          test -f result/share/applications/grok-bot.desktop
      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          version=$(jq -r .version version.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "grok-bot: bump to ${version}"
          git push origin HEAD:main
